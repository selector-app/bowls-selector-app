name: Deploy bowlslink ETL (single env)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: bowlslink-etl-deploy
      cancel-in-progress: false

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION:     ${{ secrets.GCP_REGION }}
      FUNC_NAME:      bowlslink-etl
      SCHEDULER_JOB:  bowlslink-etl
      SCHED_CRON:     "30 9 * * *"               # 09:30 daily
      SCHED_TZ:       "Australia/Melbourne"
      PG_SECRET_NAME: PG_DSN

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # Optional: keep this step if your SA can enable services; otherwise delete it.
      - name: (Optional) Enable required APIs (idempotent)
        continue-on-error: true
        run: |
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            cloudfunctions.googleapis.com run.googleapis.com cloudscheduler.googleapis.com \
            secretmanager.googleapis.com iam.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Bronze migration on Supabase
        run: |
          for f in db/bronze/*.sql; do
            echo "Applying $f"
            psql "${{ secrets.SUPABASE_DB_URI }}" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run Silver migration on Supabase
        run: |
          for f in db/silver/*.sql; do
            if [ -e "$f" ]; then
              echo "Applying $f"
              psql "${{ secrets.SUPABASE_DB_URI }}" -v ON_ERROR_STOP=1 -f "$f"
            fi
          done

      - name: Ensure Secret exists (PG_DSN)
        continue-on-error: true
        run: |
          gcloud secrets create "$PG_SECRET_NAME" --replication-policy=automatic || \
          echo "Secret already exists, continuing..."

      - name: Update Secret value (Supabase DSN)
        run: |
          printf '%s' "${{ secrets.SUPABASE_DB_URI }}" | \
          gcloud secrets versions add "$PG_SECRET_NAME" --data-file=-

      - name: Deploy Cloud Function (Gen2, Python)
        run: |
          gcloud functions deploy "$FUNC_NAME" \
            --gen2 \
            --runtime python311 \
            --region "${{ env.GCP_REGION }}" \
            --source data-pipeline \
            --entry-point main \
            --trigger-http \
            --no-allow-unauthenticated \
            --timeout=3600 \
            --memory=1024Mi \
            --set-secrets=PG_DSN=${PG_SECRET_NAME}:latest \
            --set-env-vars=ENDPOINTS_FILE=config/endpoints.json

      # 🔑 Use the DEFAULT runtime SA; don't create a new one.
      - name: Compute runtime SA (default compute) and grant permissions
        id: runtime_sa
        run: |
          PROJECT_NUMBER=$(gcloud projects describe "${{ env.GCP_PROJECT_ID }}" --format="value(projectNumber)")
          RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          echo "RUNTIME_SA=$RUNTIME_SA" >> $GITHUB_OUTPUT

          # Allow the runtime SA to read the secret (idempotent)
          gcloud secrets add-iam-policy-binding "$PG_SECRET_NAME" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/secretmanager.secretAccessor" || true

          # Allow the runtime SA to invoke the function's Cloud Run service (idempotent)
          gcloud run services add-iam-policy-binding "$FUNC_NAME" \
            --region "${{ env.GCP_REGION }}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/run.invoker" || true

      # 🗓 Create/Update Scheduler (explicit location so App Engine is NOT required)
      - name: Create/Update Cloud Scheduler job (Melbourne TZ)
        run: |
          FUNC_URL=$(gcloud functions describe "$FUNC_NAME" --gen2 --region "${{ env.GCP_REGION }}" --format="value(serviceConfig.uri)")
          RUNTIME_SA="${{ steps.runtime_sa.outputs.RUNTIME_SA }}"

          # Create or update in-place with explicit --location
          gcloud scheduler jobs create http "${{ env.SCHEDULER_JOB }}" \
            --location="${{ env.GCP_REGION }}" \
            --schedule="${{ env.SCHED_CRON }}" \
            --time-zone="${{ env.SCHED_TZ }}" \
            --uri="$FUNC_URL" \
            --http-method=POST \
            --oidc-service-account-email="$RUNTIME_SA" || \
          gcloud scheduler jobs update http "${{ env.SCHEDULER_JOB }}" \
            --location="${{ env.GCP_REGION }}" \
            --schedule="${{ env.SCHED_CRON }}" \
            --time-zone="${{ env.SCHED_TZ }}" \
            --uri="$FUNC_URL" \
            --http-method=POST \
            --oidc-service-account-email="$RUNTIME_SA"