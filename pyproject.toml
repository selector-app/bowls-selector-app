[project]
name = "bowls-selector-app"
version = "0.1.0"
description = "Bowls Selector application with data pipeline for BowlsLink API"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "functions-framework>=3.0.0,<4.0.0",
    "httpx==0.27.2",
    "orjson==3.10.7",
    "flask>=3.0.0,<4.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort (import order)
  "B",  # flake8-bugbear
  "UP", # pyupgrade
]
ignore = [
  # Allow longer lines if needed; rely on black for wrapping
  "E501",
]
exclude = [
  ".git",
  ".github",
  "**/.venv",
  "**/__pycache__",
  "**/.mypy_cache",
]

[tool.ruff.isort]
known-first-party = ["bronze", "silver", "shared"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '(\.git|\.venv|__pycache__|\.mypy_cache)'

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "data-pipeline/bronze",
  "data-pipeline/silver",
  "data-pipeline/shared",
]

[tool.hatch.build.targets.sdist]
include = [
  "data-pipeline/bronze/**",
  "data-pipeline/silver/**",
  "data-pipeline/shared/**",
  "data-pipeline/main.py",
  "data-pipeline/config/**",
]
